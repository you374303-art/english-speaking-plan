<title>英语口语计划 - UI 设计图（浅蓝色）</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0f0f1a; color: #fff; font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; padding: 40px 20px; }
  h1 { text-align: center; font-size: 32px; margin-bottom: 8px; color: #5b9bfa; }

  .gallery { display: flex; flex-wrap: wrap; gap: 32px; justify-content: center; max-width: 1300px; margin: 0 auto; }
  .item { text-align: center; }
  .item img { border-radius: 20px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); transition: transform 0.3s; }

  .desktop img { width: 100%; max-width: 960px; }

  <div class="gallery">
